<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Joker App Project</title>
    
    <!-- SUNTIKAN PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/logo.png">
    
    <style>
        /* FONT DINAMIS: Cukup ubah nama file font di GitHub menjadi font.ttf */
        @font-face {
            font-family: 'CustomFont';
            src: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: 'CustomFont', 'Segoe UI', Tahoma, sans-serif; }
        html, body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100%; min-height: 100vh; overflow: hidden; width: 100%; }
        
        #fullscreen-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; z-index: 999999; background: transparent; display: none; pointer-events: auto; }
        
        #app { width: 2392px; height: 1080px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5); transform-origin: center center; background-color: #000; overflow: hidden; }
        
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; transition: opacity 0.5s ease-in-out; }
        
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 500; }
        .nine-slice-modal { 
            position: relative; background-color: transparent; border-style: solid; border-width: 80px;
            border-image-source: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/modal_default.png');
            border-image-slice: 100 fill; border-image-repeat: stretch;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            filter: drop-shadow(0px 10px 40px rgba(0,0,0,0.8)); padding: 20px;
        }
        
        .close-corner-btn { position: absolute; top: -80px; right: -80px; width: 90px; height: 90px; object-fit: contain; cursor: pointer; z-index: 10; transition: transform 0.1s; }
        .close-corner-btn:active { transform: scale(0.85); }

        #splash-page { background: #000; display: flex; opacity: 1; align-items: center; justify-content: center; z-index: 900; }
        #logo { width: 100%; height: 100%; object-fit: contain; }
        
        #loading-page { background-image: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/background_screen4.png'); background-size: cover; background-position: center; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 120px; z-index: 800; }
        
        #loading-elements { transition: opacity 0.5s ease; display: flex; flex-direction: column; align-items: center; z-index: 10;}

        .corner-btn { position: absolute; cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; z-index: 950; }
        .corner-btn:active { transform: scale(0.9); }
        .corner-btn img { width: 250px; height: auto; object-fit: contain; }
        .corner-btn span { position: absolute; color: white; font-size: 32px; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 4px #000; pointer-events: none; text-align: center; line-height: 1.1; }
        .corner-btn.off { filter: grayscale(100%) opacity(0.5); pointer-events: none; }
        
        #btn-update-assets { left: 40px; top: 40px; }
        #btn-redownload { left: 40px; top: 160px; }
        #btn-update-plugins { left: 40px; top: 280px; }
        #btn-update-plugins span { font-size: 25px; }
        #btn-begin-app { right: 40px; top: 40px; }
        #btn-save-assets { right: 40px; top: 160px; }

        .loading-text { color: white; font-size: 32px; margin-bottom: 20px; font-weight: bold; text-align: center; text-shadow: 2px 2px 4px #000; }
        .loading-bar-bg { width: 600px; height: 20px; border: 2px solid #fff; border-radius: 10px; position: relative; overflow: hidden; background: rgba(0,0,0,0.5); }
        .loading-bar-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
        .loading-percent { color: white; font-size: 24px; position: absolute; right: -75px; top: -5px; font-weight: bold; text-shadow: 2px 2px 4px #000;}
        
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none; transition: opacity 0.5s ease; }
        
        .menu-bg-anim { width: 2884px !important; height: 1080px; object-fit: cover; animation: menuPanBg 14s linear infinite; }
        @keyframes menuPanBg { 0% { transform: translateX(0); } 42.857% { transform: translateX(-492px); } 50% { transform: translateX(-492px); } 92.857% { transform: translateX(0); } 100% { transform: translateX(0); } }

        .menu-overlay-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none; }

        #main-menu-page { z-index: 300; }
        .menu-ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        .btn-theme { position: absolute; cursor: pointer; transition: transform 0.1s; }
        .btn-theme:active { transform: scale(0.95); }
        #btn-classic-theme { left: 332px; top: 391px; width: auto; height: auto; }
        #btn-farm-theme { left: 902px; top: 391px; width: auto; height: auto; }

        #btn-start { position: absolute; right: 46px; bottom: 46px; cursor: pointer; transition: transform 0.1s; }
        #btn-start:active { transform: scale(0.9); }
        
        .graphic-box { position: absolute; right: 46px; width: auto; height: auto; }
        #box-players-count { top: 308px; }
        #box-goal-score { top: 486px; }
        
        .graphic-controller-container { position: absolute; width: 361px; height: 69px; background-color: #000; border-radius: 20px; left: 15px; bottom: 11px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; }
        .ctrl-btn { width: 59px; height: 59px; background-color: white; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; cursor: pointer; color: #000; transition: transform 0.1s; }
        .ctrl-btn:active { transform: scale(0.9); background-color: #ddd; }
        .ctrl-text { color: white; font-size: 32px; font-weight: bold; text-transform: uppercase; }

        .top-menu-btn { height: 90px; width: auto; cursor: pointer; transition: transform 0.1s; }
        .top-menu-btn:active { transform: scale(0.9); }

        #main-page { z-index: 200; background-color: #000; }
        
        .top-btn { position: absolute; top: 40px; height: 90px; width: auto; cursor: pointer; z-index: 100; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease, filter 0.3s ease; pointer-events: none; }
        .top-btn:active, .avatar-btn-img:active { transform: scale(0.9); transition: transform 0.1s; }
        #btn-option { left: 40px; }
        #btn-submit { left: 600px; }
        #btn-log { right: 600px; } 
        #btn-players { right: 40px; }
        #btn-submit.off { filter: grayscale(100%) opacity(0.4) !important; pointer-events: none !important; cursor: default !important; }
        
        #btn-winner-menu { left: 600px; z-index: 105; display: none; }
        
        #btn-next-match {
            position: absolute; top: 40px; left: 50%; height: 90px; width: auto; cursor: pointer; z-index: 105;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease; display: none;
        }
        #btn-next-match.slide-out-top { transform: translate(-50%, -150px) !important; opacity: 0 !important; pointer-events: none !important; }
        #btn-next-match.slide-in-top { transform: translate(-50%, 0) !important; opacity: 1 !important; pointer-events: auto !important; }
        #btn-next-match:active { transform: translate(-50%, 0) scale(0.9) !important; transition: transform 0.1s; }

        #round-container { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 20px; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
        #round-text { color: white; font-size: 55px; font-weight: bold; text-shadow: 3px 3px 6px #000; cursor: pointer; transition: transform 0.1s; pointer-events: auto; }
        #round-text:active { transform: scale(0.95); }
        
        .round-arrow { width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.1s; filter: drop-shadow(2px 2px 2px #000); }
        .round-arrow.show { opacity: 1; pointer-events: auto; }
        .round-arrow.left { border-right: 35px solid #2ecc71; }
        .round-arrow.right { border-left: 35px solid #2ecc71; }
        .round-arrow:active { transform: scale(0.8); }

        .slide-in-top { transform: translateY(0) !important; opacity: 1 !important; pointer-events: auto !important; }
        .slide-out-top { transform: translateY(-150px); opacity: 0; pointer-events: none !important; }
        .slide-in-bottom { transform: translateY(0) !important; opacity: 1 !important; pointer-events: auto !important; }
        .slide-out-bottom { transform: translateY(1200px); opacity: 0; pointer-events: none !important; }

        #players-container { position: absolute; top: 125px; bottom: 76px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 40px; z-index: 60; transition: transform 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.8s ease; pointer-events: none; }
        .player { position: relative; width: 340px; height: 879px; transition: transform 0.3s ease; pointer-events: auto; } 
        
        .loser-dim { filter: brightness(0.3); pointer-events: none; transition: filter 1s; }

        .player-avatar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 1; pointer-events: none; }
        .player-flag { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
        .champion-badge { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 3; pointer-events: none; }
        
        .spritesheet-wrapper { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 340px; overflow: hidden; z-index: 2; pointer-events: none; }
        .spritesheet-img { width: 900%; max-width: 900%; height: auto; animation: spriteAnimImg 1.2s steps(9) infinite; display: block; }
        @keyframes spriteAnimImg { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        .stempel-winner { position: absolute; left: 50%; top: 618px; transform-origin: top center; transform: translateX(-50%) scale(0); z-index: 30; opacity: 0; pointer-events: none; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
        .stempel-winner.show { transform: translateX(-50%) scale(1); opacity: 1; }

        .player-name-display { color: #f1c40f; font-size: 40px; font-weight: bold; text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000; text-align: center; text-transform: uppercase; white-space: nowrap; cursor: pointer; position: absolute; top: 355px; left: 50%; transform: translateX(-50%); width: 100%; z-index: 25; }
        
        .ur-container { position: absolute; top: 455px; left: 0; right: 0; display: flex; justify-content: center; gap: 25px; z-index: 26; }
        .ur-btn { width: 45px; height: 45px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #000; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .ur-btn:active { transform: scale(0.85); }
        .ur-btn.disabled { opacity: 0.3; pointer-events: none; }

        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        .player-badge-container { position: absolute; bottom: 95px; left: 50%; transform: translateX(-50%); z-index: 27; cursor: pointer; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin-top: 20px; transition: transform 0.1s; }
        .badge-icon { max-height: 100%; max-width: 100%; object-fit: contain; transition: opacity 0.2s; pointer-events: none; }
        .badge-icon.off { opacity: 0.25; filter: grayscale(100%); }
        .badge-icon.on { animation: floating 2s infinite ease-in-out; }
        
        .player-stars-container { position: absolute; left: 50%; transform: translateX(-50%); bottom: 175px; z-index: 35; display: flex; gap: 6px; pointer-events: none; align-items: center; justify-content: center; }
        
        @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .star-icon { width: auto; height: auto; }
        .star-icon.pop { animation: starPop 0.5s ease-out forwards; }

        .player-score-container { position: absolute; top: 517px; bottom: 319px; left: 50%; transform: translateX(-50%); z-index: 28; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; width: 170px; }
        .player-score-container:active { transform: translateX(-50%) scale(0.95); }
        .player-score { font-size: 80px; font-weight: bold; text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000; pointer-events: none; color: white; }
        .player-score.yellow { color: #f1c40f; }

        @keyframes pulseWinner { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .player.winner-anim { animation: pulseWinner 1.5s infinite ease-in-out; z-index: 100; filter: drop-shadow(0 0 20px rgba(241, 196, 15, 0.8)); }

        #winner-dim-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 55; opacity: 0; pointer-events: none; transition: opacity 1s; display: none; }

        /* MODALS CSS */
        .modal-title { color: #ffffff; font-size: 55px; font-weight: bold; margin-bottom: 25px; text-shadow: 2px 2px 4px #000; text-align: center; width: 100%; }
        .modal-img-btn { height: 90px; width: auto; object-fit: contain; cursor: pointer; transition: transform 0.1s; }
        .modal-img-btn:active { transform: scale(0.9); }
        .modal-btn-row { display: flex; gap: 40px; justify-content: center; margin-top: 30px; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; width: 400px; margin: 20px 0; }
        .toggle-label { color: white; font-size: 45px; font-weight: bold; }
        .toggle-bg { width: 140px; height: 70px; background-color: #000; border-radius: 35px; position: relative; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .toggle-knob { width: 60px; height: 60px; background-color: #3498db; border-radius: 30px; position: absolute; top: 5px; left: 75px; transition: left 0.3s, background-color 0.3s; }
        .toggle-bg.off .toggle-knob { left: 5px; background-color: #7f8c8d; }

        #custom-display { background: rgba(0,0,0,0.7); color: #ffffff; font-size: 90px; padding: 5px 20px; text-align: center; border-radius: 25px; font-weight: 900; min-height: 130px; display: flex; align-items: center; justify-content: center; border: 4px solid #f1c40f; box-shadow: inset 0px 5px 15px rgba(0,0,0,0.8); margin-bottom: 25px; text-transform: uppercase; transition: width 0.3s; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 450px; }
        .num-btn { border-style: solid; border-width: 25px; border-image-source: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button_edit.png'); border-image-slice: 30 fill; border-image-repeat: stretch; background: transparent; color: #fff; font-size: 42px; padding: 5px 0; cursor: pointer; font-weight: 900; transition: transform 0.1s; text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; display: flex; align-items: center; justify-content: center; }
        .num-btn:active { transform: translateY(6px) scale(0.95); }

        .log-table-wrapper { width: 1800px; max-height: 700px; overflow-y: auto; border: 3px solid #f1c40f; border-radius: 15px; background: rgba(0,0,0,0.5); position: relative; padding: 0 20px 20px 20px; }
        .log-table { width: 100%; border-collapse: collapse; color: white; font-size: 28px; text-align: center; margin-bottom: 30px; }
        .log-table th { padding: 20px; border-bottom: 4px solid #f1c40f; border-right: 2px solid #f1c40f; font-weight: bold; position: sticky; top: 0; background: #2c3e50; color: #f1c40f; z-index: 5;}
        .log-table td { padding: 18px; border-bottom: 2px solid #f1c40f; border-right: 2px solid #f1c40f; }
        .trash-btn { background-color: #e74c3c; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 22px; transition: transform 0.1s; margin-left: 10px; }
        .trash-btn:active { transform: scale(0.85); }
        .editable-cell { cursor: pointer !important; background-color: rgba(255,255,255,0.1); transition: background-color 0.2s; }
        .editable-cell:hover { background-color: rgba(255,255,255,0.2); }
        .col-hide { display: none; }
        
        #btn-log-edit { position: absolute; left: 40px; top: 40px; height: 60px; cursor: pointer; z-index: 10; transition: transform 0.1s; }
        #btn-log-edit:active { transform: scale(0.9); }

        .avatar-scroll-container { display: flex; gap: 40px; overflow-x: auto; align-items: center; justify-content: flex-start; scroll-behavior: smooth; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 20px; scrollbar-width: none; }
        .avatar-scroll-container::-webkit-scrollbar { display: none; }
        .avatar-wrapper { position: relative; cursor: pointer; transition: transform 0.1s; flex-shrink: 0; }
        .avatar-wrapper:active { transform: scale(0.93); }
        .avatar-option { display: block; border-radius: 20px; transition: filter 0.3s, opacity 0.3s; filter: grayscale(100%); opacity: 0.6; }
        .avatar-wrapper.selected .avatar-option { filter: grayscale(0%); opacity: 1; }
        .avatar-border-overlay { position: absolute; top: -10px; left: -10px; width: calc(100% + 20px); height: calc(100% + 20px); z-index: 2; pointer-events: none; display: none; }
        .avatar-wrapper.selected .avatar-border-overlay { display: block; }
        .scroll-arrow { cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s, transform 0.1s; padding: 10px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)); }
        .scroll-arrow:active { transform: scale(0.9); }

        .tutorial-content { width: 1400px; max-height: 600px; overflow-y: auto; color: white; font-size: 32px; line-height: 1.6; text-align: left; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 20px; }

        #transition-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background-color:#000; z-index:9000; display:none; opacity:0; transition:opacity 0.3s ease; justify-content:center; align-items:center; flex-direction:column; }
        @keyframes spinner-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="fullscreen-overlay"></div>

<div id="app">
    <!-- LAYAR PRE-LOAD TRANSISI -->
    <div id="transition-overlay">
        <div class="loading-text" style="font-size: 55px;" id="preload-text">MEMUAT ASET...</div>
        <div style="width:80px; height:80px; border:8px solid #333; border-top:8px solid #f1c40f; border-radius:50%; animation:spinner-spin 1s linear infinite; margin-top:30px;"></div>
    </div>

    <!-- SPLASH -->
    <div id="splash-page" class="page">
        <img id="logo" src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/logo.png" alt="Logo" onerror="this.style.display='none'">
    </div>

    <!-- LOADING SCREEN -->
    <div id="loading-page" class="page">
        
        <div id="btn-update-assets" class="corner-btn" onclick="runUpdate()">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button.png">
            <span>Update</span>
        </div>
        
        <div id="btn-redownload" class="corner-btn" onclick="runRedownload()">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button.png">
            <span>Redownload</span>
        </div>

        <div id="btn-update-plugins" class="corner-btn" onclick="runUpdatePlugins()">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button.png">
            <span>Update Plugins</span>
        </div>
        
        <div id="btn-begin-app" class="corner-btn" onclick="handleBeginApp()">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button.png">
            <span>Begin</span>
        </div>
        
        <div id="btn-save-assets" class="corner-btn off" onclick="runSaveAssets()">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button.png">
            <span>Save Asset</span>
        </div>

        <div id="loading-elements">
            <div class="loading-text" id="lbl-loading">Memeriksa Aset...</div>
            <div id="loading-bar-container" style="position: relative; display: none;">
                <div class="loading-bar-bg"><div class="loading-bar-fill" id="loading-fill"></div></div>
                <div class="loading-percent" id="loading-percent">0%</div>
            </div>
        </div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu-page" class="page">
        <video id="menu-bg-video" class="bg-layer menu-bg-anim" loop muted playsinline style="display: none;"></video>
        <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/menu_screen.png" class="menu-overlay-img">
        
        <div class="menu-ui-layer">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/thumbnail_classic_on.png" id="btn-classic-theme" class="btn-theme" onclick="selectTheme('classic')">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/thumbnail_farm_off.png" id="btn-farm-theme" class="btn-theme" onclick="selectTheme('farm')">
            
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/start.png" id="btn-start" onclick="startGame()">
            
            <div id="box-players-count" class="graphic-box">
                <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/players_count.png" style="width: auto; height: auto;">
                <div class="graphic-controller-container">
                    <div class="ctrl-btn" onclick="adjustPlayers(-1)">-</div>
                    <div class="ctrl-text" id="lbl-players-count">3 PLAYERS</div>
                    <div class="ctrl-btn" onclick="adjustPlayers(1)">+</div>
                </div>
            </div>
            
            <div id="box-goal-score" class="graphic-box">

    const AudioSys = {
        bgmOn: true, sfxOn: true, currentBGMName: null, currentBGMObj: null, currentFadeInterval: null, externalMusicPlaying: false,
        playBGM(name) {
            if (this.currentBGMName === name) {
                if(this.currentBGMObj && this.currentBGMObj.volume === 0) this.currentBGMObj.volume = 1; 
                return;
            }
            if(this.currentFadeInterval) clearInterval(this.currentFadeInterval);
            if(this.currentBGMObj) { this.currentBGMObj.pause(); this.currentBGMObj.currentTime = 0; this.currentBGMObj.volume = 1; }
            this.currentBGMName = name;
            if(name) {
                this.currentBGMObj = new Audio(BASE_URL + name);
                this.currentBGMObj.volume = 1;
                this.currentBGMObj.loop = (name !== 'bgm_fanfare.mp3'); 
                if (this.bgmOn && !this.externalMusicPlaying) this.currentBGMObj.play().catch(e=>{});
            }
        },
        pauseBGMForPlugin() {
            this.externalMusicPlaying = true;
            if (this.currentBGMObj) this.currentBGMObj.pause();
        },
        resumeBGMFromPlugin() {
            this.externalMusicPlaying = false;
            if (this.bgmOn && this.currentBGMObj) this.currentBGMObj.play().catch(e=>{});
        },
        fadeOutBGM(duration = 1000) {
            if(!this.currentBGMObj) return;
            if(this.currentFadeInterval) clearInterval(this.currentFadeInterval);
            const audio = this.currentBGMObj;
            const step = 50; const volStep = audio.volume / (duration / step);
            this.currentFadeInterval = setInterval(() => {
                if(audio.volume - volStep > 0) { audio.volume -= volStep; } 
                else { audio.volume = 0; audio.pause(); clearInterval(this.currentFadeInterval); }
            }, step);
        },
        playSFX(name) { if (!this.sfxOn) return; let a = new Audio(BASE_URL + name); a.play().catch(e=>{}); },
        toggleBGM() {
            this.bgmOn = !this.bgmOn;
            if(this.bgmOn && this.currentBGMObj && !this.externalMusicPlaying) this.currentBGMObj.play().catch(e=>{});
            else if(!this.bgmOn && this.currentBGMObj) this.currentBGMObj.pause();
            document.getElementById('toggle-bgm').className = this.bgmOn ? 'toggle-bg' : 'toggle-bg off';
            this.playSFX('button.mp3');
        },
        toggleSFX() {
            this.sfxOn = !this.sfxOn;
            document.getElementById('toggle-sfx').className = this.sfxOn ? 'toggle-bg' : 'toggle-bg off';
            this.playSFX('button.mp3');
        }
    };

    // ================== PLUGIN BRIDGE API ==================
    window.JokerPlugins = {
        registry: [],
        hooks: {
            onMainScreenEnter: [],
            onMainScreenLeave: [],
            onPlayersRender: []
        },
        register(pluginObj) {
            if (this.registry.some(p => p.id === pluginObj.id)) return;
            this.registry.push(pluginObj);
            if (typeof pluginObj.init === 'function') {
                try { pluginObj.init(this.getContext()); } catch (e) { console.error('Plugin init error:', e); }
            }
        },
        on(eventName, fn) {
            if (this.hooks[eventName]) this.hooks[eventName].push(fn);
        },
        emit(eventName, payload) {
            if (this.hooks[eventName]) {
                this.hooks[eventName].forEach(fn => {
                    try { fn(payload); } catch (e) {}
                });
            }
        },
        getContext() {
            return {
                BASE_URL,
                AudioSys,
                getAppState: () => appState,
                getActivePlayerCount: () => activePlayerCount,
                getAppElement: () => document.getElementById('app'),
                getMainPage: () => document.getElementById('main-page'),
                getPluginLayer: () => document.getElementById('plugin-main-layer'),
                getPlayersContainer: () => document.getElementById('players-container'),
                getAppTransformState: () => {
                    const vw = window.innerWidth || document.documentElement.clientWidth || screen.width || 2392;
                    const vh = window.innerHeight || document.documentElement.clientHeight || screen.height || 1080;
                    const isPortrait = vh > vw;
                    const scale = isPortrait ? Math.min(vw / 1080, vh / 2392) : Math.min(vw / 2392, vh / 1080);
                    return { isPortrait, scale: scale > 0 ? scale : 0.5 };
                }
            };
        }
    };

    async function loadInstalledPlugins() {
        const defaultPlugins = ['plugins/music_player/plugin.js'];
        let pluginsToLoad = defaultPlugins;
        try {
            const res = await fetch(BASE_URL + 'plugins/plugins.json');
            if (res.ok) {
                const list = await res.json();
                if (Array.isArray(list) && list.length > 0) pluginsToLoad = list;
            }
        } catch (e) {}

        for (const relPath of pluginsToLoad) {
            try {
                const jsRes = await fetch(BASE_URL + relPath);
                if (jsRes.ok) {
                    const code = await jsRes.text();
                    (new Function(code))();
                }
            } catch (e) {
                console.error('Gagal memuat plugin:', relPath, e);
            }
        }
    }
    // =======================================================
    
    function resizeApp() {
        const app = document.getElementById('app');
        if (!app) return;
        const vw = window.innerWidth || document.documentElement.clientWidth || screen.width || 2392;
        const vh = window.innerHeight || document.documentElement.clientHeight || screen.height || 1080;
        const isPortrait = vh > vw;
        let scale = isPortrait ? Math.min(vw / 1080, vh / 2392) : Math.min(vw / 2392, vh / 1080);
        if (!scale || scale <= 0) scale = 0.5;
        app.style.transform = `translate(-50%, -50%) ${isPortrait ? 'rotate(90deg)' : ''} scale(${scale})`;
        app.style.position = 'absolute';
        app.style.top = '50%';
        app.style.left = '50%';
    }
    window.addEventListener('resize', resizeApp);
    window.addEventListener('orientationchange', () => { resizeApp(); setTimeout(resizeApp, 200); });
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeApp);

    async function checkAssetsPercentage() {
        let percent = 0;
        if ('caches' in window) {
            try {
                const cache = await caches.open(CACHE_NAME);
                let matchCount = 0;
                for (let asset of assets) {
                    const res = await cache.match(BASE_URL + asset, { ignoreSearch: true });
                    if (res) matchCount++;
                }
                percent = Math.floor((matchCount / assets.length) * 100);
                if (percent > 100) percent = 100;
            } catch(e) {}
        }
        
        document.getElementById('lbl-loading').innerText = `${percent}% Assets downloaded`;
        const btnUpdate = document.getElementById('btn-update-assets');
        
        if (percent === 100) { btnUpdate.classList.add('off'); } 
        else { btnUpdate.classList.remove('off'); }
    }

    function toggleDownloadButtons(state) {
        const btnUpdate = document.getElementById('btn-update-assets');
        const btnRedownload = document.getElementById('btn-redownload');
        const btnUpdatePlugins = document.getElementById('btn-update-plugins');
        const btnBegin = document.getElementById('btn-begin-app');
        const btnSave = document.getElementById('btn-save-assets');
        
        if (state) {
            btnUpdate.style.pointerEvents = 'auto';
            btnRedownload.style.pointerEvents = 'auto';
            btnUpdatePlugins.style.pointerEvents = 'auto';
            btnBegin.style.pointerEvents = 'auto';
            btnBegin.classList.remove('off');
        } else {
            btnUpdate.style.pointerEvents = 'none';
            btnRedownload.style.pointerEvents = 'none';
            btnUpdatePlugins.style.pointerEvents = 'none';
            btnBegin.style.pointerEvents = 'none';
            btnSave.style.pointerEvents = 'none';
        }
    }

    async function runUpdate() {
        AudioSys.playSFX('button.mp3'); 
        toggleDownloadButtons(false);
        const fill = document.getElementById('loading-fill'); const percentUI = document.getElementById('loading-percent'); const lbl = document.getElementById('lbl-loading');
        document.getElementById('loading-bar-container').style.display = 'block';

        let loaded = 0; const total = assets.length;
        if ('caches' in window) {
            try {
                const mainCache = await caches.open(CACHE_NAME);
                const tempCache = await caches.open(TEMP_CACHE);
                for (let asset of assets) {
                    let url = BASE_URL + asset; lbl.innerText = `Memeriksa Asset: ${asset}`;
                    let needsDownload = true;
                    
                    const cachedRes = await mainCache.match(url, { ignoreSearch: true });
                    if (cachedRes) {
                        try {
                            const headRes = await fetch(url, { method: 'HEAD' });
                            const netETag = headRes.headers.get('ETag'); const cacheETag = cachedRes.headers.get('ETag');
                            const netSize = headRes.headers.get('Content-Length'); const cacheSize = cachedRes.headers.get('Content-Length');
                            if ((netETag && cacheETag && netETag === cacheETag) || (netSize && cacheSize && netSize === cacheSize)) { 
                                needsDownload = false; await tempCache.put(url, cachedRes.clone()); 
                            }
                        } catch(e){}
                    }
                    if (needsDownload) {
                        lbl.innerText = `Downloading Asset: ${asset}`;
                        try { const fetchRes = await fetch(url, { cache: "no-store" }); if (fetchRes.ok) await tempCache.put(url, fetchRes); } catch(e){}
                    }
                    loaded++; let p = Math.floor((loaded/total)*100); fill.style.width = p+'%'; percentUI.innerText = p+'%';
                }
                lbl.innerText = `100% Asset siap disimpan.`; 
                const btnSave = document.getElementById('btn-save-assets');
                btnSave.classList.remove('off');
                btnSave.style.pointerEvents = 'auto';
            } catch (e) { lbl.innerText = "Error saat Update."; }
        }
        toggleDownloadButtons(true);
        checkAssetsPercentage();
    }

    // UPDATE KHUSUS ASSET PLUGINS
    async function runUpdatePlugins() {
        AudioSys.playSFX('button.mp3');
        toggleDownloadButtons(false);
        const fill = document.getElementById('loading-fill');
        const percentUI = document.getElementById('loading-percent');
        const lbl = document.getElementById('lbl-loading');
        document.getElementById('loading-bar-container').style.display = 'block';
        fill.style.width = '0%';
        percentUI.innerText = '0%';

        lbl.innerText = "Memeriksa daftar file plugin...";

        const pluginStaticAssets = [
            'plugins/plugins.json',
            'plugins/music_player/plugin.js',
            'plugins/music_player/images/music_disc.png',
            'plugins/music_player/images/tools_background.png',
            'plugins/music_player/images/button_play.png',
            'plugins/music_player/images/button_next.png',
            'plugins/music_player/images/button_previous.png',
            'plugins/music_player/images/button_playlist.png',
            'plugins/music_player/images/playlist_background.png'
        ];

        let songFiles = [];
        try {
            const apiRes = await fetch('https://api.github.com/repos/udankkeramat/Underground-Joker/contents/plugins/music_player/song', { cache: 'no-store' });
            if (apiRes.ok) {
                const items = await apiRes.json();
                if (Array.isArray(items)) {
                    songFiles = items
                        .filter(item => item.type === 'file' && /\.(mp3|ogg|wav|m4a|webm)$/i.test(item.name))
                        .map(item => item.name);
                    localStorage.setItem('joker_plugin_songs', JSON.stringify(songFiles));
                }
            }
        } catch (e) {
            const cachedSongs = localStorage.getItem('joker_plugin_songs');
            if (cachedSongs) songFiles = JSON.parse(cachedSongs);
        }

        const allPluginPaths = [
            ...pluginStaticAssets,
            ...songFiles.map(name => `plugins/music_player/song/${encodeURIComponent(name)}`)
        ];

        let loaded = 0;
        const total = allPluginPaths.length;

        if ('caches' in window && total > 0) {
            try {
                const mainCache = await caches.open(CACHE_NAME);
                const tempCache = await caches.open(TEMP_CACHE);

                for (let relPath of allPluginPaths) {
                    const url = BASE_URL + relPath;
                    const displayName = decodeURIComponent(relPath.split('/').pop());
                    lbl.innerText = `Memeriksa Plugin Asset: ${displayName}`;
                    let needsDownload = true;

                    const cachedRes = await mainCache.match(url, { ignoreSearch: true });
                    if (cachedRes) {
                        try {
                            const headRes = await fetch(url, { method: 'HEAD' });
                            const netETag = headRes.headers.get('ETag');
                            const cacheETag = cachedRes.headers.get('ETag');
                            const netSize = headRes.headers.get('Content-Length');
                            const cacheSize = cachedRes.headers.get('Content-Length');
                            if ((netETag && cacheETag && netETag === cacheETag) || (netSize && cacheSize && netSize === cacheSize)) {
                                needsDownload = false;
                                await tempCache.put(url, cachedRes.clone());
                            }
                        } catch (e) {}
                    }

                    if (needsDownload) {
                        lbl.innerText = `Downloading Plugin: ${displayName}`;
                        try {
                            const fetchRes = await fetch(url, { cache: 'no-store' });
                            if (fetchRes.ok) await tempCache.put(url, fetchRes);
                        } catch (e) {}
                    }

                    loaded++;
                    const p = Math.floor((loaded / total) * 100);
                    fill.style.width = p + '%';
                    percentUI.innerText = p + '%';
                }

                lbl.innerText = `100% Plugin Asset siap disimpan.`;
                const btnSave = document.getElementById('btn-save-assets');
                btnSave.classList.remove('off');
                btnSave.style.pointerEvents = 'auto';
            } catch (e) {
                lbl.innerText = "Error saat Update Plugins.";
            }
        }
        toggleDownloadButtons(true);
    }

    async function runSaveAssets() {
        AudioSys.playSFX('button.mp3');

        }

    function transitionWithPreload(videoElem, onReady) {
        const overlay = document.getElementById('transition-overlay');
        overlay.style.display = 'flex'; void overlay.offsetWidth; overlay.style.opacity = '1';

        setTimeout(() => {
            let done = false;
            function finish() {
                if (done) return; done = true;
                videoElem.oncanplaythrough = null; videoElem.oncanplay = null;
                videoElem.play().catch(e => {});
                onReady();
                setTimeout(() => { overlay.style.opacity = '0'; setTimeout(() => overlay.style.display = 'none', 300); }, 100);
            }
            if (videoElem.readyState >= 3) { finish(); } 
            else { 
                videoElem.oncanplay = finish; videoElem.oncanplaythrough = finish; 
                videoElem.load(); setTimeout(finish, 2000); 
            }
        }, 300);
    }

    function handleActionSubmit() { if(logRoundsData.some(r => r.matchNum === currentMatch && r.roundNum === currentRound)) showNotif(t('already_submitted').replace('{round}', currentRound), true, execSubmit); else showNotif(t('submit_confirm').replace('{round}', currentRound), true, execSubmit); }

    function execSubmit() {
        let snap = { matchNum: currentMatch, roundNum: currentRound, players: [] };
        for(let i=0; i<activePlayerCount; i++) snap.players.push({ playerName: customPlayerNames[i], avatarIdx: playerAvatars[i], score: playerScores[i], hasBadge: playerBadges[i] }); 
        logRoundsData.push(snap); saveLog();
        
        saveGameState(); 
        
        let rn = currentRound <= 20 ? currentRound+'.mp3' : '1.mp3';
        (function playS(idx, seq){
            if(idx>=seq.length) { postSubmitCheck(); return; }
            let a = new Audio(BASE_URL+seq[idx]); a.onended = () => playS(idx+1, seq);
            if(AudioSys.sfxOn) a.play().catch(e=>postSubmitCheck()); else playS(idx+1, seq);
        })(0, ['score_for_round.mp3', rn]);
        
        for(let i=0; i<activePlayerCount; i++) scoreColors[i] = 'white'; renderPlayers();
    }
    
    function postSubmitCheck() {
        let hasStarSound = false;
        for(let i=0; i<activePlayerCount; i++) {
            if(playerBadges[i]) {
                playerStars[i] = (playerStars[i]+1)%11;
                let sF = "1_star.mp3"; if(playerStars[i]==2) sF="wildcard.mp3"; else if(playerStars[i]==3) sF="illusionist.mp3"; else if(playerStars[i]==4) sF="mastermind.mp3"; else if(playerStars[i]==5) sF="godlike.mp3"; else if(playerStars[i]==6) sF="legendary.mp3"; else if(playerStars[i]>=7) sF="god_of_joker.mp3";
                let seq = [avatarNamesList[playerAvatars[i]]+'.mp3', sF]; hasStarSound = true;
                (function playS(idx){ if(idx>=seq.length) { checkWinnersAndProceed(); return; } let a = new Audio(BASE_URL+seq[idx]); a.onended=()=>playS(idx+1); if(AudioSys.sfxOn) a.play().catch(e=>playS(idx+1)); else playS(idx+1); })(0);
                renderPlayers(); const stars = document.querySelectorAll(`#stars-cont-${i} .star-icon`); if(stars.length > 0) stars[stars.length-1].classList.add('pop'); break;
            }
        } if (!hasStarSound) checkWinnersAndProceed();
    }

    function checkWinnersAndProceed() {
        let goal = goalScoresOpts[goalScoreIdx]; let qualifiers = []; for(let i=0; i<activePlayerCount; i++) if(playerScores[i] >= goal) qualifiers.push(i);
        if(qualifiers.length > 0) { let maxS = Math.max(...qualifiers.map(idx => playerScores[idx])); let winners = qualifiers.filter(idx => playerScores[idx] === maxS); triggerWinnerSequence(winners); } 
        else { currentRound = (currentRound%99)+1; document.getElementById('round-text').innerText = `${t('round')} ${currentRound}`; saveGameState(); } 
    }

    function buildLogTable() {
        const wrapper = document.getElementById('log-table-container'); wrapper.innerHTML = ''; let targetData = logEditable ? tempLogRoundsData : logRoundsData;
        if(targetData.length === 0) { wrapper.innerHTML = `<div style="color:white; font-size:32px; text-align:center; padding:60px; font-weight:bold;">${t('empty_log')}</div>`; return; }
        
        for (let m = 1; m <= currentMatch; m++) {
            let matchRounds = targetData.filter(rd => rd.matchNum === m); if (matchRounds.length === 0 && m !== currentMatch) continue;
            let isCurrentMatch = (m === currentMatch);
            let matchTitle = document.createElement('div'); matchTitle.style.color = '#f1c40f'; matchTitle.style.fontSize = '35px'; matchTitle.style.fontWeight = 'bold'; matchTitle.style.textAlign = 'center'; matchTitle.style.margin = '20px 0 10px 0'; matchTitle.style.textShadow = '2px 2px 0px #000'; matchTitle.innerText = `${t('match_lbl').toUpperCase()} ${m}`; wrapper.appendChild(matchTitle);

            let table = document.createElement('table'); table.className = 'log-table'; let thead = document.createElement('thead'); let htr = document.createElement('tr'); htr.innerHTML = `<th>${t('round')}</th>`;
            let numCols = isCurrentMatch ? activePlayerCount : (matchRounds.length > 0 ? matchRounds[0].players.length : activePlayerCount);
            
            for(let p = 0; p < numCols; p++) { let pName = customPlayerNames[p] || `P${p+1}`; if (!isCurrentMatch && matchRounds.length > 0 && matchRounds[0].players[p]) { pName = matchRounds[0].players[p].playerName; } htr.innerHTML += `<th>${pName}</th>`; }
            if (isCurrentMatch) { htr.innerHTML += `<th class="${logEditable ? '' : 'col-hide'}"><div style="display:flex; justify-content:center; gap:10px;"><div class="ur-btn ${logScreenHistoryIndex>0 ? '' : 'disabled'}" style="transform:scale(0.8);" onclick="logUndo()">&#8634;</div><div class="ur-btn ${logScreenHistoryIndex<logScreenHistory.length-1 ? '' : 'disabled'}" style="transform:scale(0.8);" onclick="logRedo()">&#8635;</div></div></th>`; }
            thead.appendChild(htr); table.appendChild(thead);
            
            let tbody = document.createElement('tbody');
            if (matchRounds.length === 0) { let emptyColspan = 1 + numCols + (isCurrentMatch ? 1 : 0); tbody.innerHTML = `<tr><td colspan="${emptyColspan}" style="padding:25px; color:#95a5a6; font-style:italic;">-</td></tr>`; } 
            else {
                matchRounds.forEach((rd) => {
                    let rIdx = targetData.findIndex(x => x === rd); let tr = document.createElement('tr'); tr.innerHTML = `<td style="color:#f1c40f;font-weight:bold">${t('round')} ${rd.roundNum}</td>`;
                    for(let pIdx=0; pIdx < numCols; pIdx++) {
                        let pd = rd.players[pIdx];
                        if(pd) {
                            let td = document.createElement('td'); if(logEditable && isCurrentMatch) td.className = 'editable-cell';
                            let badgeHTML = pd.hasBadge ? `<img src="${BASE_URL}badge.png" style="height:40px; cursor:${(logEditable && isCurrentMatch)?'pointer':'default'};" onclick="event.stopPropagation(); if(${isCurrentMatch}) toggleLogBadge(${rIdx}, ${pIdx})">` : `<div style="width:40px; height:40px; cursor:${(logEditable && isCurrentMatch)?'pointer':'default'};" onclick="event.stopPropagation(); if(${isCurrentMatch}) toggleLogBadge(${rIdx}, ${pIdx})"></div>`;
                            td.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;">${badgeHTML} <span>${pd.score}</span></div>`; if(logEditable && isCurrentMatch) td.onclick = () => openKeypad('score', rIdx, pIdx); tr.appendChild(td);
                        } else { tr.innerHTML += `<td>-</td>`; }
                    }
                    if (isCurrentMatch) { let dtd = document.createElement('td'); dtd.className = logEditable ? '' : 'col-hide'; let db = document.createElement('button'); db.className='trash-btn'; db.innerHTML='&#128465;'; db.onclick = () => { AudioSys.playSFX('button.mp3'); tempLogRoundsData.splice(rIdx, 1); buildLogTable(); }; dtd.appendChild(db); tr.appendChild(dtd); }
                    tbody.appendChild(tr);
                });
            } table.appendChild(tbody); wrapper.appendChild(table);
        }
    }

    window.addEventListener('popstate', (e) => {
        history.pushState({ trapped: true }, null, location.href);
        const notifModal = document.getElementById('notification-modal');
        if (notifModal.style.display === 'flex') { notifModal.style.display = 'none'; AudioSys.playSFX('close.mp3'); return; }
        let modalClosed = false;
        document.querySelectorAll('.modal-overlay').forEach(m => { if (m.style.display === 'flex') { m.style.display = 'none'; modalClosed = true; } });
        if (modalClosed) { AudioSys.playSFX('close.mp3'); if (logEditable) cancelLogEdit(); return; }
        confirmExit();
    });

    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { resizeApp(); ensureFullscreen(); setTimeout(() => { resizeApp(); ensureFullscreen(); }, 500); } });
    window.addEventListener('touchstart', ensureFullscreen, { passive: true }); window.addEventListener('click', ensureFullscreen, { passive: true });

</script>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
