<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Joker App Project</title>
    
    <!-- SUNTIKAN PWA (Manifest & Theme Color) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/logo.png">
    
    <style>
        @font-face {
            font-family: 'Velthoven';
            src: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/velthoven_black.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; font-family: 'Velthoven', 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; width: 100vw; }
        
        #fullscreen-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100vw; height: 100vh; z-index: 999999; background: transparent; display: none; pointer-events: auto; }
        
        #app { width: 2392px; height: 1080px; position: relative; transform-origin: center center; background-color: #000; overflow: hidden; }
        
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; transition: opacity 0.5s ease-in-out; }
        
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 500; }
        .nine-slice-modal { 
            position: relative; background-color: transparent; border-style: solid; border-width: 80px;
            border-image-source: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/modal_default.png');
            border-image-slice: 100 fill; border-image-repeat: stretch;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            filter: drop-shadow(0px 10px 40px rgba(0,0,0,0.8)); padding: 20px;
        }
        
        .close-corner-btn { position: absolute; top: -80px; right: -80px; width: 90px; height: 90px; object-fit: contain; cursor: pointer; z-index: 10; transition: transform 0.1s; }
        .close-corner-btn:active { transform: scale(0.85); }

        #splash-page { background: #000; align-items: center; justify-content: center; z-index: 900; }
        #logo { width: 100%; height: 100%; object-fit: contain; }
        
        #loading-page { background-image: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/background_screen4.png'); background-size: cover; background-position: center; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 120px; z-index: 800; }
        
        #loading-elements, #tap-to-continue { transition: opacity 0.5s ease; }
        #tap-to-continue { position: absolute; bottom: 120px; color: white; font-size: 55px; font-weight: bold; text-shadow: 0 0 10px #f1c40f; animation: pulseText 1.5s infinite; cursor: pointer; display: none; opacity: 0; }
        @keyframes pulseText { 0% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.5; transform: scale(0.95); } }

        .loading-text { color: white; font-size: 32px; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .loading-bar-bg { width: 600px; height: 20px; border: 2px solid #fff; border-radius: 10px; position: relative; overflow: hidden; }
        .loading-bar-fill { height: 100%; background: #fff; width: 0%; transition: width 0.1s linear; }
        .loading-percent { color: white; font-size: 24px; position: absolute; right: -60px; top: -5px; font-weight: bold; }
        
        .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; pointer-events: none; transition: opacity 0.5s ease; }
        
        .menu-bg-anim {
            width: 2884px !important; 
            height: 1080px;
            object-fit: cover;
            animation: menuPanBg 14s linear infinite;
        }
        @keyframes menuPanBg {
            0% { transform: translateX(0); }
            42.857% { transform: translateX(-492px); }
            50% { transform: translateX(-492px); }
            92.857% { transform: translateX(0); }
            100% { transform: translateX(0); }
        }

        .menu-overlay-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; pointer-events: none; }

        #main-menu-page { z-index: 300; }
        .menu-ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }
        
        .btn-theme { position: absolute; cursor: pointer; transition: transform 0.1s; }
        .btn-theme:active { transform: scale(0.95); }
        #btn-classic-theme { left: 332px; top: 391px; width: auto; height: auto; }
        #btn-farm-theme { left: 902px; top: 391px; width: auto; height: auto; }

        #btn-start { position: absolute; right: 46px; bottom: 46px; cursor: pointer; transition: transform 0.1s; }
        #btn-start:active { transform: scale(0.9); }
        
        .graphic-box { position: absolute; right: 46px; width: auto; height: auto; }
        #box-players-count { top: 308px; }
        #box-goal-score { top: 486px; }
        
        .graphic-controller-container { position: absolute; width: 361px; height: 69px; background-color: #000; border-radius: 20px; left: 15px; bottom: 11px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px; }
        .ctrl-btn { width: 59px; height: 59px; background-color: white; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 40px; font-weight: bold; cursor: pointer; color: #000; transition: transform 0.1s; }
        .ctrl-btn:active { transform: scale(0.9); background-color: #ddd; }
        .ctrl-text { color: white; font-size: 32px; font-weight: bold; text-transform: uppercase; }

        .top-menu-btn { height: 90px; width: auto; cursor: pointer; transition: transform 0.1s; }
        .top-menu-btn:active { transform: scale(0.9); }

        #main-page { z-index: 200; background-color: #000; }
        
        .top-btn { position: absolute; top: 40px; height: 90px; width: auto; cursor: pointer; z-index: 100; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease, filter 0.3s ease; pointer-events: none; }
        .top-btn:active, .avatar-btn-img:active { transform: scale(0.9); transition: transform 0.1s; }
        #btn-option { left: 40px; }
        #btn-submit { left: 600px; }
        #btn-log { right: 600px; } 
        #btn-players { right: 40px; }
        #btn-submit.off { filter: grayscale(100%) opacity(0.4) !important; pointer-events: none !important; cursor: default !important; }
        
        #btn-winner-menu { left: 600px; z-index: 105; display: none; }
        
        #btn-next-match {
            position: absolute; top: 40px; left: 50%; height: 90px; width: auto; cursor: pointer; z-index: 105;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease; display: none;
        }
        #btn-next-match.slide-out-top { transform: translate(-50%, -150px) !important; opacity: 0 !important; pointer-events: none !important; }
        #btn-next-match.slide-in-top { transform: translate(-50%, 0) !important; opacity: 1 !important; pointer-events: auto !important; }
        #btn-next-match:active { transform: translate(-50%, 0) scale(0.9) !important; transition: transform 0.1s; }

        #round-container { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 20px; opacity: 0; transition: opacity 0.6s ease; pointer-events: none; }
        #round-text { color: white; font-size: 55px; font-weight: bold; text-shadow: 3px 3px 6px #000; cursor: pointer; transition: transform 0.1s; pointer-events: auto; }
        #round-text:active { transform: scale(0.95); }
        
        .round-arrow { width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.1s; filter: drop-shadow(2px 2px 2px #000); }
        .round-arrow.show { opacity: 1; pointer-events: auto; }
        .round-arrow.left { border-right: 35px solid #2ecc71; }
        .round-arrow.right { border-left: 35px solid #2ecc71; }
        .round-arrow:active { transform: scale(0.8); }

        .slide-in-top { transform: translateY(0) !important; opacity: 1 !important; pointer-events: auto !important; }
        .slide-out-top { transform: translateY(-150px); opacity: 0; pointer-events: none !important; }
        .slide-in-bottom { transform: translateY(0) !important; opacity: 1 !important; pointer-events: auto !important; }
        .slide-out-bottom { transform: translateY(1200px); opacity: 0; pointer-events: none !important; }

        #players-container { position: absolute; top: 125px; bottom: 76px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 40px; z-index: 60; transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease; pointer-events: none; }
        .player { position: relative; width: 340px; height: 879px; transition: transform 0.3s ease; pointer-events: auto; } 
        
        .loser-dim { filter: brightness(0.3); pointer-events: none; transition: filter 1s; }

        .player-avatar { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 1; pointer-events: none; }
        .player-flag { position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 2; pointer-events: none; }
        
        .spritesheet-wrapper {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 340px; overflow: hidden; z-index: 2; pointer-events: none;
        }
        .spritesheet-img {
            width: 900%; max-width: 900%; height: auto;
            animation: spriteAnimImg 1.2s steps(9) infinite;
            display: block;
        }
        @keyframes spriteAnimImg {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .stempel-winner { position: absolute; left: 50%; top: 618px; transform-origin: top center; transform: translateX(-50%) scale(0); z-index: 30; opacity: 0; pointer-events: none; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
        .stempel-winner.show { transform: translateX(-50%) scale(1); opacity: 1; }

        .player-name-display { color: #f1c40f; font-size: 40px; font-weight: bold; text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000; text-align: center; text-transform: uppercase; white-space: nowrap; cursor: pointer; position: absolute; top: 355px; left: 50%; transform: translateX(-50%); width: 100%; z-index: 25; }
        
        .ur-container { position: absolute; top: 455px; left: 0; right: 0; display: flex; justify-content: center; gap: 25px; z-index: 26; }
        .ur-btn { width: 45px; height: 45px; border-radius: 50%; background-color: rgba(255, 255, 255, 0.5); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #000; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        .ur-btn:active { transform: scale(0.85); }
        .ur-btn.disabled { opacity: 0.3; pointer-events: none; }

        @keyframes floating { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        .player-badge-container { position: absolute; bottom: 95px; left: 50%; transform: translateX(-50%); z-index: 27; cursor: pointer; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin-top: 20px; transition: transform 0.1s; }
        .badge-icon { max-height: 100%; max-width: 100%; object-fit: contain; transition: opacity 0.2s; pointer-events: none; }
        .badge-icon.off { opacity: 0.25; filter: grayscale(100%); }
        .badge-icon.on { animation: floating 2s infinite ease-in-out; }
        
        .player-stars-container { position: absolute; left: 50%; transform: translateX(-50%); bottom: 175px; z-index: 35; display: flex; gap: 6px; pointer-events: none; align-items: center; justify-content: center; }
        
        @keyframes starPop { 0% { transform: scale(0); opacity: 0; } 60% { transform: scale(1.4); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        .star-icon { width: auto; height: auto; }
        .star-icon.pop { animation: starPop 0.5s ease-out forwards; }

        .player-score-container { position: absolute; top: 517px; bottom: 319px; left: 50%; transform: translateX(-50%); z-index: 28; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s; width: 170px; }
        .player-score-container:active { transform: translateX(-50%) scale(0.95); }
        .player-score { font-size: 80px; font-weight: bold; text-shadow: 4px 4px 0px #000, -4px -4px 0px #000, 4px -4px 0px #000, -4px 4px 0px #000; pointer-events: none; color: white; }
        .player-score.yellow { color: #f1c40f; }

        @keyframes pulseWinner { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .player.winner-anim { animation: pulseWinner 1.5s infinite ease-in-out; z-index: 100; filter: drop-shadow(0 0 20px rgba(241, 196, 15, 0.8)); }

        #winner-dim-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 55; opacity: 0; pointer-events: none; transition: opacity 1s; display: none; }

        .modal-title { color: #ffffff; font-size: 55px; font-weight: bold; margin-bottom: 25px; text-shadow: 2px 2px 4px #000; text-align: center; width: 100%; }
        .modal-img-btn { height: 90px; width: auto; object-fit: contain; cursor: pointer; transition: transform 0.1s; }
        .modal-img-btn:active { transform: scale(0.9); }
        .modal-btn-row { display: flex; gap: 40px; justify-content: center; margin-top: 30px; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; width: 400px; margin: 20px 0; }
        .toggle-label { color: white; font-size: 45px; font-weight: bold; }
        .toggle-bg { width: 140px; height: 70px; background-color: #000; border-radius: 35px; position: relative; cursor: pointer; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        .toggle-knob { width: 60px; height: 60px; background-color: #3498db; border-radius: 30px; position: absolute; top: 5px; left: 75px; transition: left 0.3s, background-color 0.3s; }
        .toggle-bg.off .toggle-knob { left: 5px; background-color: #7f8c8d; }

        #custom-display { 
            background: rgba(0,0,0,0.7); color: #ffffff; font-size: 90px; padding: 5px 20px; 
            text-align: center; border-radius: 25px; font-weight: 900; min-height: 130px; 
            display: flex; align-items: center; justify-content: center; border: 4px solid #f1c40f; 
            box-shadow: inset 0px 5px 15px rgba(0,0,0,0.8); margin-bottom: 25px; 
            text-transform: uppercase; transition: width 0.3s; 
        }
        
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 450px; }
        
        .num-btn { 
            border-style: solid; 
            border-width: 25px; 
            border-image-source: url('https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/button_edit.png'); 
            border-image-slice: 30 fill; border-image-repeat: stretch;
            background: transparent; color: #fff; font-size: 42px; padding: 5px 0; 
            cursor: pointer; font-weight: 900; transition: transform 0.1s; 
            text-shadow: 3px 3px 0px #000, -2px -2px 0px #000, 2px -2px 0px #000, -2px 2px 0px #000; 
            display: flex; align-items: center; justify-content: center;
        }
        .num-btn:active { transform: translateY(6px) scale(0.95); }

        .log-table-wrapper { width: 1800px; max-height: 700px; overflow-y: auto; border: 3px solid #f1c40f; border-radius: 15px; background: rgba(0,0,0,0.5); position: relative; padding: 0 20px 20px 20px; }
        .log-table { width: 100%; border-collapse: collapse; color: white; font-size: 28px; text-align: center; margin-bottom: 30px; }
        .log-table th { padding: 20px; border-bottom: 4px solid #f1c40f; border-right: 2px solid #f1c40f; font-weight: bold; position: sticky; top: 0; background: #2c3e50; color: #f1c40f; z-index: 5;}
        .log-table td { padding: 18px; border-bottom: 2px solid #f1c40f; border-right: 2px solid #f1c40f; }
        
        .trash-btn { background-color: #e74c3c; color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 22px; transition: transform 0.1s; margin-left: 10px; }
        .trash-btn:active { transform: scale(0.85); }
        
        .editable-cell { cursor: pointer !important; background-color: rgba(255,255,255,0.1); transition: background-color 0.2s; }
        .editable-cell:hover { background-color: rgba(255,255,255,0.2); }
        .col-hide { display: none; }
        
        #btn-log-edit { position: absolute; left: 40px; top: 40px; height: 60px; cursor: pointer; z-index: 10; transition: transform 0.1s; }
        #btn-log-edit:active { transform: scale(0.9); }

        .avatar-scroll-container { display: flex; gap: 40px; overflow-x: auto; align-items: center; justify-content: flex-start; scroll-behavior: smooth; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 20px; scrollbar-width: none; }
        .avatar-scroll-container::-webkit-scrollbar { display: none; }
        
        .avatar-wrapper { position: relative; cursor: pointer; transition: transform 0.1s; flex-shrink: 0; }
        .avatar-wrapper:active { transform: scale(0.93); }
        
        .avatar-option { display: block; border-radius: 20px; transition: filter 0.3s, opacity 0.3s; filter: grayscale(100%); opacity: 0.6; }
        .avatar-wrapper.selected .avatar-option { filter: grayscale(0%); opacity: 1; }
        
        .avatar-border-overlay { position: absolute; top: -10px; left: -10px; width: calc(100% + 20px); height: calc(100% + 20px); z-index: 2; pointer-events: none; display: none; }
        .avatar-wrapper.selected .avatar-border-overlay { display: block; }

        .scroll-arrow { cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s, transform 0.1s; padding: 10px; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5)); }
        .scroll-arrow:active { transform: scale(0.9); }

        .tutorial-content { width: 1400px; max-height: 600px; overflow-y: auto; color: white; font-size: 32px; line-height: 1.6; text-align: left; padding: 20px; background: rgba(0,0,0,0.4); border-radius: 20px; }

        @media screen and (max-width: 1080px) and (orientation: portrait) { #app { transform: rotate(90deg); transform-origin: center center; } }
    </style>
</head>
<body>

<div id="fullscreen-overlay"></div>

<div id="app">
    <!-- SPLASH -->
    <div id="splash-page" class="page">
        <img id="logo" src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/logo.png" alt="Logo">
    </div>

    <!-- LOADING -->
    <div id="loading-page" class="page" onclick="handleTapToContinue()">
        <div id="loading-elements">
            <div class="loading-text" id="lbl-loading">Downloading & Syncing Assets...</div>
            <div style="position: relative;">
                <div class="loading-bar-bg"><div class="loading-bar-fill" id="loading-fill"></div></div>
                <div class="loading-percent" id="loading-percent">0%</div>
            </div>
        </div>
        <div id="tap-to-continue">Tap screen to Continue</div>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu-page" class="page">
        <video id="menu-bg-video" class="bg-layer menu-bg-anim" loop muted playsinline style="display: none;"></video>
        <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/menu_screen.png" class="menu-overlay-img">
        
        <div class="menu-ui-layer">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/thumbnail_classic_on.png" id="btn-classic-theme" class="btn-theme" onclick="selectTheme('classic')">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/thumbnail_farm_off.png" id="btn-farm-theme" class="btn-theme" onclick="selectTheme('farm')">
            
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/start.png" id="btn-start" onclick="startGame()">
            
            <div id="box-players-count" class="graphic-box">
                <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/players_count.png" style="width: auto; height: auto;">
                <div class="graphic-controller-container">
                    <div class="ctrl-btn" onclick="adjustPlayers(-1)">-</div>
                    <div class="ctrl-text" id="lbl-players-count">3 PLAYERS</div>
                    <div class="ctrl-btn" onclick="adjustPlayers(1)">+</div>
                </div>
            </div>
            
            <div id="box-goal-score" class="graphic-box">
                <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/goal_score.png" style="width: auto; height: auto;">
                <div class="graphic-controller-container">
                    <div class="ctrl-btn" onclick="adjustGoal(-1)">&lt;</div>
                    <div class="ctrl-text" id="lbl-goal-score">1000</div>
                    <div class="ctrl-btn" onclick="adjustGoal(1)">&gt;</div>
                </div>
            </div>

            <div style="position: absolute; top: 33px; left: 0; width: 1544px; display: flex; justify-content: flex-end; gap: 75px; padding-right: 75px; align-items: flex-start; z-index: 10;">
                <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/exit_app.png" id="btn-exit-menu" class="top-menu-btn" onclick="confirmExit()">
                <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/language.png" id="btn-lang-menu" class="top-menu-btn" onclick="openModal('lang-modal')">
            </div>
            
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/sound.png" id="btn-sound-menu" class="top-menu-btn" onclick="openModal('sound-modal')" style="position: absolute; left: 1544px; top: 33px; z-index: 10;">
            <img src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/tutorial.png" id="btn-tutorial-main" class="top-menu-btn" onclick="openModal('tutorial-modal')" style="position: absolute; left: 46px; bottom: 96px; z-index: 10;">
        </div>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="main-page" class="page">
        <video id="game-bg-video" class="bg-layer" loop muted playsinline style="display: none;"></video>
        
        <div id="winner-dim-overlay"></div>

        <img id="btn-option" class="top-btn slide-out-top" src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/option.png" onclick="openModal('option-modal')">
        <img id="btn-submit" class="top-btn slide-out-top off" src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/submit.png" onclick="handleActionSubmit()">
        
        <!-- Winner Screen Controls -->
        <img id="btn-winner-menu" class="top-btn slide-out-top" src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/main_menu.png" onclick="confirmMainMenu()">
        <img id="btn-next-match" class="slide-out-top" src="https://raw.githubusercontent.com/udankkeramat/Underground-Joker/main/next_match.png" onclick="confirmNextMatch()">

<script>

    const i18n = {

    };
    let currentLang = 'id';
    function t(key) { return i18n[currentLang][key] || key; }

    const AudioSys = {
        bgmOn: true, sfxOn: true, currentBGMName: null, currentBGMObj: null, currentFadeInterval: null,
        playBGM(name) {
            if (this.currentBGMName === name) {
                if(this.currentBGMObj && this.currentBGMObj.volume === 0) this.currentBGMObj.volume = 1; 
                return;
            }
            if(this.currentFadeInterval) clearInterval(this.currentFadeInterval);
            if(this.currentBGMObj) { this.currentBGMObj.pause(); this.currentBGMObj.currentTime = 0; this.currentBGMObj.volume = 1; }
            this.currentBGMName = name;
            if(name) {
                this.currentBGMObj = new Audio(BASE_URL + name);
                this.currentBGMObj.volume = 1;
                this.currentBGMObj.loop = (name !== 'bgm_fanfare.mp3'); 
                if (this.bgmOn) this.currentBGMObj.play().catch(e=>{});
            }
        },
        fadeOutBGM(duration = 1000) {
            if(!this.currentBGMObj) return;
            if(this.currentFadeInterval) clearInterval(this.currentFadeInterval);
            const audio = this.currentBGMObj;
            const step = 50; const volStep = audio.volume / (duration / step);
            this.currentFadeInterval = setInterval(() => {
                if(audio.volume - volStep > 0) { audio.volume -= volStep; } 
                else { audio.volume = 0; audio.pause(); clearInterval(this.currentFadeInterval); }
            }, step);
        },
        playSFX(name) { if (!this.sfxOn) return; new Audio(BASE_URL + name).play().catch(e=>{}); },
        toggleBGM() {
            this.bgmOn = !this.bgmOn;
            if(this.bgmOn && this.currentBGMObj) this.currentBGMObj.play().catch(e=>{});
            else if(!this.bgmOn && this.currentBGMObj) this.currentBGMObj.pause();
            document.getElementById('toggle-bgm').className = this.bgmOn ? 'toggle-bg' : 'toggle-bg off';
            this.playSFX('button.mp3');
        },
        toggleSFX() {
            this.sfxOn = !this.sfxOn;
            document.getElementById('toggle-sfx').className = this.sfxOn ? 'toggle-bg' : 'toggle-bg off';
            this.playSFX('button.mp3');
        }
    };
    window.toggleAudioType = (type) => { if(type==='bgm') AudioSys.toggleBGM(); else AudioSys.toggleSFX(); };

    let appState = 'splash';
    let selectedTheme = 'classic';
    let menuPlayerCount = 3; let activePlayerCount = 3;
    let goalScoresOpts = [500, 1000, 2000]; let goalScoreIdx = 1; 

    let currentMatch = 1;
    let currentRound = 1;
    let playerScores = [], scoreColors = [], playerStars = [], playerBadges = [], playerAvatars = [], customPlayerNames = [];
    let scoreHistory = [], historyIndex = [];
    
    let logRoundsData = [], logScreenHistory = [], logScreenHistoryIndex = 0;
    let tempLogRoundsData = []; 
    let logEditable = false; let isWinnerState = false;
    let downloadComplete = false; let tapToContinueReady = false;
    
    const avatarNamesList = ["kamaruddin", "rustam", "suardi", "ridwan", "rizal", "rudy", "fajrin", "arya", "juragan", "tolingu"];
    
    function resizeApp() {
        const app = document.getElementById('app');
        const isPortrait = window.innerHeight > window.innerWidth;
        let scale = isPortrait ? Math.min(window.innerWidth / 1080, window.innerHeight / 2392) 
                               : Math.min(window.innerWidth / 2392, window.innerHeight / 1080);
        app.style.transform = `translate(-50%, -50%) ${isPortrait ? 'rotate(90deg)' : ''} scale(${scale})`;
        app.style.position = 'absolute'; app.style.top = '50%'; app.style.left = '50%';
    }
    window.addEventListener('resize', resizeApp); window.addEventListener('orientationchange', resizeApp); resizeApp();

    // FUNGSI CEK PWA
    function isRunningAsPWA() {
        return window.matchMedia('(display-mode: standalone)').matches || 
               window.matchMedia('(display-mode: fullscreen)').matches || 
               window.navigator.standalone === true;
    }

    async function ensureFullscreen() {
        try {
            if (!document.fullscreenElement && !isRunningAsPWA()) { await document.documentElement.requestFullscreen(); }
            if (screen.orientation && screen.orientation.lock) { await screen.orientation.lock('landscape'); }
        } catch (e) {}
    }

    function handleFsInteraction(e) {
        e.stopPropagation(); e.preventDefault();
        ensureFullscreen().then(() => {
            if (appState === 'loading' && tapToContinueReady) { handleTapToContinue(); }
        });
    }

    const fsOverlay = document.getElementById('fullscreen-overlay');
    fsOverlay.addEventListener('click', handleFsInteraction, {capture: true});
    fsOverlay.addEventListener('pointerdown', handleFsInteraction, {capture: true});
    fsOverlay.addEventListener('touchstart', handleFsInteraction, {capture: true, passive: false});

    document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && !isRunningAsPWA()) fsOverlay.style.display = 'block'; 
        else fsOverlay.style.display = 'none';
    });

    const assets = [
        'logo.png', 'background.png', 'background_classic.mp4', 'background_farm.mp4', 'menu_screen.png', 'background_screen4.png',
        'thumbnail_classic_on.png', 'thumbnail_classic_off.png', 'thumbnail_farm_on.png', 'thumbnail_farm_off.png',
        'players_count.png', 'goal_score.png', 'sound.png', 'tutorial.png', 'exit_app.png', 'start.png', 'main_menu.png', 'next_match.png',
        'option.png', 'players.png', 'star.png', 'star_2.png', 'use.png', 'back.png', 'border_avatar.png', 'badge.png',
        'flag_1_classic.png', 'flag_2_classic.png', 'flag_3_classic.png', 'flag_4_classic.png', 'flag_5_classic.png',
        'flag_1_farm.png', 'flag_2_farm.png', 'flag_3_farm.png', 'flag_4_farm.png', 'flag_5_farm.png',
        'submit.png', 'log.png', 'modal_default.png', 'close.png', 'cancel.png', 'yes.png', 'no.png', 'ok.png', 
        'english.png', 'indonesia.png', 'reset.png', 'language.png', 'edit.png', 'winner.png', 'button_edit.png',
        'velthoven_black.ttf',
        'close.mp3', 'keypad.mp3', 'start.mp3', 'notification.mp3', 'button.mp3', 'welcome.mp3', 'score_for_round.mp3',
        'bgm_main_menu.mp3', 'bgm_classic.mp3', 'bgm_farm.mp3', 'bgm_fanfare.mp3',
        '1_star.mp3', 'wildcard.mp3', 'illusionist.mp3', 'mastermind.mp3', 'godlike.mp3', 'legendary.mp3', 'god_of_joker.mp3', 'on_the_stage.mp3'
    ];

    window.onload = () => {
        if (!document.fullscreenElement && !isRunningAsPWA()) { 
            fsOverlay.style.display = 'block'; 
        } else {
            fsOverlay.style.display = 'none';
            if (isRunningAsPWA() && screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(e => {});
            }
        }
        
        document.getElementById('splash-page').style.display = 'flex';
        setTimeout(() => { document.getElementById('splash-page').style.opacity = '1'; }, 50);
        setTimeout(() => { 
            document.getElementById('splash-page').style.opacity = '0';
            setTimeout(() => { 
                document.getElementById('splash-page').style.display = 'none'; 
                document.getElementById('loading-page').style.display = 'flex';
                appState = 'loading';
                setTimeout(() => { document.getElementById('loading-page').style.opacity = '1'; loadAssets(); }, 50);
            }, 500);
        }, 2000);
    };

    async function loadAssets() {
        let loaded = 0; const total = assets.length;
        const fill = document.getElementById('loading-fill'); const percent = document.getElementById('loading-percent');
        let cache = null;
        if ('caches' in window && window.location.protocol !== 'file:') { try { cache = await caches.open('joker-assets-v19'); } catch(e){} }

        for (let urlStr of assets) {
            let url = BASE_URL + urlStr;
            if (cache) {
                try {
                    const cachedRes = await cache.match(url);
                    let needsUpdate = true;
                    if (cachedRes) {
                        const headRes = await fetch(url, { method: 'HEAD' });
                        if (headRes.headers.get('etag') === cachedRes.headers.get('etag') || headRes.headers.get('content-length') === cachedRes.headers.get('content-length')) {
                            needsUpdate = false;
                        }
                    }
                    if (needsUpdate) { const fetchRes = await fetch(url); if (fetchRes.ok) await cache.put(url, fetchRes.clone()); }
                } catch(e){}
            }
            if (!url.endsWith('.mp3') && !url.endsWith('.mp4') && !url.endsWith('.ttf')) { 
                await new Promise(r => { let img = new Image(); img.onload=r; img.onerror=r; img.src=url; }); 
            }
            loaded++; let p = Math.floor((loaded/total)*100); fill.style.width = p+'%'; percent.innerText = p+'%';
        }
        
        setTimeout(() => {
            document.getElementById('loading-elements').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading-elements').style.display = 'none';
                document.getElementById('tap-to-continue').style.display = 'block';
                setTimeout(() => { document.getElementById('tap-to-continue').style.opacity = '1'; downloadComplete = true; tapToContinueReady = true; }, 50);
            }, 500);
        }, 500);
    }

    function handleTapToContinue() {
        if(!downloadComplete) return; downloadComplete = false; tapToContinueReady = false;
        document.getElementById('loading-page').style.opacity = '0';
        setTimeout(() => { document.getElementById('loading-page').style.display = 'none'; initMainMenu(); }, 500);
    }

    function showNotif(msg, withConfirm, onYes, onNo) {
        AudioSys.playSFX('notification.mp3');
        document.getElementById('notif-title').innerText = t('notif'); document.getElementById('notif-msg').innerHTML = msg;
        const btns = document.getElementById('notif-btns'); btns.innerHTML = '';
        if(withConfirm) {
            let noBtn = document.createElement('img'); noBtn.src = BASE_URL + 'no.png'; noBtn.className = 'modal-img-btn';

    function getFlagAsset(score) {
        let level = 5; if(score > 200) level = 4; if(score > 400) level = 3; if(score > 600) level = 2; if(score > 800) level = 1;
        return `flag_${level}_${selectedTheme}.png`;
    }

    function generateStarsHTML(starCount, pIdx) {
        let html = '';
        if (starCount <= 5) { for (let s = 0; s < starCount; s++) html += `<img src="${BASE_URL}star.png" class="star-icon" alt="Star">`; }
        else {
            for (let s = 0; s < (10 - starCount); s++) html += `<img src="${BASE_URL}star.png" class="star-icon" alt="Star">`;
            for (let s = 0; s < (starCount - 5); s++) html += `<img src="${BASE_URL}star_2.png" class="star-icon" alt="Star 2">`;
        }
        return html;
    }

    function checkSubmitState() {
        if(isWinnerState) return;
        const btn = document.getElementById('btn-submit'); let allFilled = true;
        for(let i=0; i<activePlayerCount; i++) { if(scoreColors[i] !== 'yellow') allFilled = false; }
        if(allFilled) btn.classList.remove('off'); else btn.classList.add('off');
    }

    function cyclePlayerCount() {
        if(isWinnerState) return;
        AudioSys.playSFX('button.mp3'); activePlayerCount++; if (activePlayerCount > 6) activePlayerCount = 2; renderPlayers();
    }

    function renderPlayers() {
        const container = document.getElementById('players-container'); container.innerHTML = '';
        for (let i = 0; i < activePlayerCount; i++) {
            const playerDiv = document.createElement('div'); playerDiv.className = 'player'; playerDiv.id = `player-cont-${i}`;
            
            let flagAsset = getFlagAsset(playerScores[i]);
            let isSprite = flagAsset.startsWith('flag_1_');
            let flagHTML = isSprite 
                ? `<div class="spritesheet-wrapper"><img src="${BASE_URL}${flagAsset}" class="spritesheet-img"></div>`
                : `<img src="${BASE_URL}${flagAsset}" class="player-flag">`;
            
            playerDiv.innerHTML = `
                <img src="${BASE_URL}avatar_${avatarNamesList[playerAvatars[i]]}.png" class="player-avatar">
                ${flagHTML}
                <img src="${BASE_URL}winner.png" class="stempel-winner" id="stempel-${i}">
                <div class="player-name-display" onclick="if(!isWinnerState) openKeypad('name', null, ${i})">${customPlayerNames[i]}</div>
                <div class="player-stars-container" id="stars-cont-${i}">${generateStarsHTML(playerStars[i], i)}</div>
                <div class="player-badge-container" onclick="if(!isWinnerState) toggleBadge(${i})">
                    <img src="${BASE_URL}badge.png" class="badge-icon ${playerBadges[i] ? 'on' : 'off'}">
                </div>
                <div class="ur-container">
                    <div class="ur-btn ${historyIndex[i] > 0 ? '' : 'disabled'}" onclick="if(!isWinnerState) playerUndo(${i})">&#8634;</div>
                    <div class="ur-btn ${historyIndex[i] < scoreHistory[i].length - 1 ? '' : 'disabled'}" onclick="if(!isWinnerState) playerRedo(${i})">&#8635;</div>
                </div>
                <div class="player-score-container" onclick="if(!isWinnerState) openKeypad('score', null, ${i})">
                    <span class="player-score ${scoreColors[i]}">${playerScores[i]}</span>
                </div>
                <div style="position:absolute; top:0; left:0; right:0; height:330px; z-index:10; cursor:pointer;" onclick="if(!isWinnerState) openAvatarSelect(${i})"></div>
            `;
            container.appendChild(playerDiv);
        }
        checkSubmitState();
    }

    function playerUndo(i) { AudioSys.playSFX('button.mp3'); if(historyIndex[i] > 0) { historyIndex[i]--; playerScores[i] = scoreHistory[i][historyIndex[i]]; renderPlayers(); } }
    function playerRedo(i) { AudioSys.playSFX('button.mp3'); if(historyIndex[i] < scoreHistory[i].length-1) { historyIndex[i]++; playerScores[i] = scoreHistory[i][historyIndex[i]]; renderPlayers(); } }
    
    function toggleBadge(i) {
        AudioSys.playSFX('button.mp3');
        if (playerBadges[i]) { 
            playerStars[i] = (playerStars[i]+1)%11; renderPlayers();
            const stars = document.querySelectorAll(`#stars-cont-${i} .star-icon`);
            if(stars.length > 0) stars[stars.length-1].classList.add('pop');
        } else { playerBadges.fill(false); playerBadges[i] = true; renderPlayers(); }
    }

    let roundTimeout;
    function toggleRoundArrows() {
        if(isWinnerState) return;
        AudioSys.playSFX('button.mp3'); let dec = document.getElementById('round-dec'); let inc = document.getElementById('round-inc');
        if(dec.classList.contains('show')) { hideRoundArrows(); return; }
        dec.classList.add('show'); inc.classList.add('show'); resetRoundTimeout();
    }
    function hideRoundArrows() { document.getElementById('round-dec').classList.remove('show'); document.getElementById('round-inc').classList.remove('show'); }
    function resetRoundTimeout() { clearTimeout(roundTimeout); roundTimeout = setTimeout(hideRoundArrows, 10000); }
    function adjustRound(dir) { AudioSys.playSFX('button.mp3'); currentRound += dir; if(currentRound < 1) currentRound = 99; if(currentRound > 99) currentRound = 1; document.getElementById('round-text').innerText = `${t('round')} ${currentRound}`; resetRoundTimeout(); }

    let currentKeypadType = ''; let currentKeypadTarget = { rIdx: null, pIdx: null }; let keypadValue = "";

    function openKeypad(type, rIdx, pIdx) {
        AudioSys.playSFX('button.mp3'); currentKeypadType = type; currentKeypadTarget = { rIdx, pIdx };
        const isMain = rIdx === null;
        document.getElementById('score-name-title').innerText = type === 'score' ? t('edit_score') : t('edit_name');
        const display = document.getElementById('custom-display');
        
        if (type === 'score') {
            display.style.width = '450px'; keypadValue = ""; display.innerText = "0"; renderNumPad();
        } else {
            display.style.width = '950px'; keypadValue = isMain ? customPlayerNames[pIdx] : tempLogRoundsData[rIdx].players[pIdx].playerName; 
            display.innerText = keypadValue; renderAlphaPad();
        }
        document.getElementById('btn-keypad-ok').onclick = () => { submitKeypad(); }; openModal('score-name-modal');
    }
    
    function kInp(c) {
        AudioSys.playSFX('keypad.mp3'); const display = document.getElementById('custom-display');
        if(currentKeypadType === 'score') {
            if(c === '-') keypadValue = keypadValue.startsWith('-') ? keypadValue.substring(1) : '-' + keypadValue;
            else if(keypadValue.replace('-','').length < 5) keypadValue += c;
            display.innerText = keypadValue || "0";
        } else { if(keypadValue.length < 10) keypadValue += c; display.innerText = keypadValue; }
    }
    function kDel() { AudioSys.playSFX('keypad.mp3'); keypadValue = keypadValue.slice(0, -1); document.getElementById('custom-display').innerText = currentKeypadType === 'score' ? (keypadValue||"0") : keypadValue; }

    function renderNumPad() {
        const grid = document.getElementById('numpad-grid'); grid.style.gridTemplateColumns = "repeat(3, 1fr)"; grid.style.width = "450px";
        let html = ''; 
        for(let i=1; i<=9; i++) html += `<button class="num-btn" onclick="kInp('${i}')">${i}</button>`;
        html += `<button class="num-btn" onclick="kInp('-')">-</button>
                 <button class="num-btn" onclick="kInp('0')">0</button>
                 <button class="num-btn" onclick="kDel()">DEL</button>`;
        grid.innerHTML = html;
    }
    function renderAlphaPad() {
        const grid = document.getElementById('numpad-grid'); grid.style.gridTemplateColumns = "repeat(10, 1fr)"; grid.style.width = "950px";
        let html = ''; 
        for(let i=1; i<=9; i++) html += `<button class="num-btn" onclick="kInp('${i}')">${i}</button>`;
        html += `<button class="num-btn" onclick="kInp('0')">0</button>`;
        
        const r2 = "QWERTYUIOP", r3 = "ASDFGHJKL", r4 = "ZXCVBNM";
        for(let c of r2) html += `<button class="num-btn" onclick="kInp('${c}')">${c}</button>`;
        for(let c of r3) html += `<button class="num-btn" onclick="kInp('${c}')">${c}</button>`; 
        html += `<button class="num-btn" onclick="kDel()">DEL</button>`;
        for(let c of r4) html += `<button class="num-btn" onclick="kInp('${c}')">${c}</button>`; 
        html += `<button class="num-btn" onclick="kInp(' ')" style="grid-column: span 3;">SPACE</button>`;
        grid.innerHTML = html;
    }

    function submitKeypad() {
        AudioSys.playSFX('button.mp3'); const { rIdx, pIdx } = currentKeypadTarget; const isMain = rIdx === null;
        if (currentKeypadType === 'score') {
            let val = parseInt(keypadValue);
            if(!isNaN(val)) {
                if(isMain) {
                    playerScores[pIdx] += val; scoreColors[pIdx] = 'yellow';
                    scoreHistory[pIdx] = scoreHistory[pIdx].slice(0, historyIndex[pIdx]+1); scoreHistory[pIdx].push(playerScores[pIdx]); historyIndex[pIdx]++;
                    renderPlayers();
                } else { tempLogRoundsData[rIdx].players[pIdx].score = val; buildLogTable(); }
            }
        } else {
            let v = keypadValue.trim().toUpperCase();
            if(v) {
                if(isMain) { customPlayerNames[pIdx] = v; renderPlayers(); if(logRoundsData.length>0) buildLogTable(); }
                else { tempLogRoundsData[rIdx].players[pIdx].playerName = v; buildLogTable(); }
            }
        }
        closeModal('score-name-modal');
    }

    let currentAvatarTarget = null;
    
    function onAvatarImgLoad() {
        const container = document.getElementById('avatar-grid-container');
        const firstAvatar = container.querySelector('.avatar-option');
        if (firstAvatar && firstAvatar.naturalWidth > 0) {
            const targetWidth = (firstAvatar.naturalWidth * 3) + (40 * 2);
            container.style.width = targetWidth + 'px';
            checkAvatarScroll();
        }
    }

    function scrollAvatar(dir) {
        const container = document.getElementById('avatar-grid-container');
        const firstAvatar = container.querySelector('.avatar-option');
        let scrollAmt = firstAvatar ? (firstAvatar.naturalWidth + 40) : 200; 
        container.scrollBy({ left: dir * scrollAmt, behavior: 'smooth' });
    }

    function checkAvatarScroll() {
        const cont = document.getElementById('avatar-grid-container');
        const leftArr = document.getElementById('avatar-scroll-left');
        const rightArr = document.getElementById('avatar-scroll-right');
        if (!cont) return;

        if (cont.scrollLeft > 5) {
            leftArr.style.opacity = '1'; leftArr.style.pointerEvents = 'auto';
        } else {
            leftArr.style.opacity = '0'; leftArr.style.pointerEvents = 'none';
        }
        
        if (Math.ceil(cont.scrollLeft + cont.clientWidth) < cont.scrollWidth - 5) {
            rightArr.style.opacity = '1'; rightArr.style.pointerEvents = 'auto';
        } else {
            rightArr.style.opacity = '0'; rightArr.style.pointerEvents = 'none';
        }
    }

    function openAvatarSelect(pIdx) {
        currentAvatarTarget = pIdx; 
        const container = document.getElementById('avatar-grid-container'); 
        container.innerHTML = '';
        
        avatarNamesList.forEach((name, a) => {
            const w = document.createElement('div'); w.className = 'avatar-wrapper';
            if (a === playerAvatars[pIdx]) w.classList.add('selected');
            w.innerHTML = `<img src="${BASE_URL}avatar_${name}.png" class="avatar-option" onload="onAvatarImgLoad()"><img src="${BASE_URL}border_avatar.png" class="avatar-border-overlay">`;
            w.onclick = () => { AudioSys.playSFX('button.mp3'); container.querySelectorAll('.avatar-wrapper').forEach(el => el.classList.remove('selected')); w.classList.add('selected'); currentAvatarTarget = {pIdx, a}; };
            container.appendChild(w);
        });
        
        document.getElementById('btn-use-avatar').onclick = () => {
            if(currentAvatarTarget && currentAvatarTarget.a !== undefined) {
                let aIdx = currentAvatarTarget.a; playerAvatars[pIdx] = aIdx; customPlayerNames[pIdx] = avatarNamesList[aIdx].toUpperCase();
                let seq = [avatarNamesList[aIdx]+'.mp3', 'on_the_stage.mp3'];
                (function playS(idx){
                    if(idx>=seq.length) return; let a = new Audio(BASE_URL+seq[idx]); a.onended = () => playS(idx+1);
                    if(AudioSys.sfxOn) a.play().catch(e=>{}); else playS(idx+1);
                })(0);
                renderPlayers();
            }
            closeModal('avatar-modal');
        };
        
        openModal('avatar-modal');
        setTimeout(checkAvatarScroll, 100);
    }

    function handleActionSubmit() {
        if(logRoundsData.some(r => r.matchNum === currentMatch && r.roundNum === currentRound)) {
            showNotif(t('already_submitted').replace('{round}', currentRound), true, execSubmit);
        } else {
            showNotif(t('submit_confirm').replace('{round}', currentRound), true, execSubmit);
        }
    }

    function execSubmit() {
        let snap = { matchNum: currentMatch, roundNum: currentRound, players: [] };
        for(let i=0; i<activePlayerCount; i++) { snap.players.push({ playerName: customPlayerNames[i], avatarIdx: playerAvatars[i], score: playerScores[i], hasBadge: playerBadges[i] }); }
        logRoundsData.push(snap); saveLog();
        
        let rn = currentRound <= 20 ? currentRound+'.mp3' : '1.mp3';
        (function playS(idx, seq){
            if(idx>=seq.length) { postSubmitCheck(); return; }
            let a = new Audio(BASE_URL+seq[idx]); a.onended = () => playS(idx+1, seq);
            if(AudioSys.sfxOn) a.play().catch(e=>postSubmitCheck()); else playS(idx+1, seq);
        })(0, ['score_for_round.mp3', rn]);
        
        for(let i=0; i<activePlayerCount; i++) scoreColors[i] = 'white';
        renderPlayers();
    }
    
    function postSubmitCheck() {
        let hasStarSound = false;
        for(let i=0; i<activePlayerCount; i++) {
            if(playerBadges[i]) {
                playerStars[i] = (playerStars[i]+1)%11;
                let sF = "1_star.mp3";
                if(playerStars[i]==2) sF="wildcard.mp3"; else if(playerStars[i]==3) sF="illusionist.mp3";
                else if(playerStars[i]==4) sF="mastermind.mp3"; else if(playerStars[i]==5) sF="godlike.mp3";
                else if(playerStars[i]==6) sF="legendary.mp3"; else if(playerStars[i]>=7) sF="god_of_joker.mp3";
                
                let seq = [avatarNamesList[playerAvatars[i]]+'.mp3', sF];
                hasStarSound = true;
                
                (function playS(idx){
                    if(idx>=seq.length) { checkWinnersAndProceed(); return; }
                    let a = new Audio(BASE_URL+seq[idx]); a.onended=()=>playS(idx+1);
                    if(AudioSys.sfxOn) a.play().catch(e=>playS(idx+1)); else playS(idx+1);
                })(0);
                
                renderPlayers();
                const stars = document.querySelectorAll(`#stars-cont-${i} .star-icon`);
                if(stars.length > 0) stars[stars.length-1].classList.add('pop');
                break;
            }
        }
        
        if (!hasStarSound) { checkWinnersAndProceed(); }
    }

    function checkWinnersAndProceed() {
        let goal = goalScoresOpts[goalScoreIdx]; let qualifiers = [];
        for(let i=0; i<activePlayerCount; i++) if(playerScores[i] >= goal) qualifiers.push(i);
        
        if(qualifiers.length > 0) {
            let maxS = Math.max(...qualifiers.map(idx => playerScores[idx]));
            let winners = qualifiers.filter(idx => playerScores[idx] === maxS);
            triggerWinnerSequence(winners);
        } else {
            currentRound = (currentRound%99)+1; document.getElementById('round-text').innerText = `${t('round')} ${currentRound}`;
        }
    }

    function triggerWinnerSequence(winnerIndices) {
        isWinnerState = true;
        
        document.getElementById('btn-option').classList.replace('slide-in-top', 'slide-out-top');
        document.getElementById('btn-submit').classList.replace('slide-in-top', 'slide-out-top');
        document.getElementById('btn-players').classList.replace('slide-in-top', 'slide-out-top');
        document.getElementById('round-container').style.opacity = '0';
        
        const btnLog = document.getElementById('btn-log');
        btnLog.classList.replace('slide-in-top', 'slide-out-top');

        const btnMenu = document.getElementById('btn-winner-menu');
        btnMenu.classList.remove('slide-in-top');
        btnMenu.classList.add('slide-out-top');
        btnMenu.style.display = 'block';

        const btnNext = document.getElementById('btn-next-match');
        btnNext.classList.remove('slide-in-top');
        btnNext.classList.add('slide-out-top');
        btnNext.style.display = 'block';

        const dimOverlay = document.getElementById('winner-dim-overlay');
        dimOverlay.style.display = 'block'; setTimeout(() => { dimOverlay.style.opacity = '1'; }, 50);

        for (let i = 0; i < activePlayerCount; i++) {
            const pc = document.getElementById(`player-cont-${i}`);
            if(!winnerIndices.includes(i)) pc.classList.add('loser-dim');
        }
        
        AudioSys.playBGM('bgm_fanfare.mp3');
        
        setTimeout(() => {
            winnerIndices.forEach(idx => { document.getElementById(`stempel-${idx}`).classList.add('show'); });
            setTimeout(() => {
                winnerIndices.forEach(idx => { document.getElementById(`player-cont-${idx}`).classList.add('winner-anim'); });
                
                btnLog.style.zIndex = '105'; 
                
                setTimeout(() => {
                    btnLog.classList.replace('slide-out-top', 'slide-in-top');
                    btnMenu.classList.replace('slide-out-top', 'slide-in-top');
                    btnNext.classList.replace('slide-out-top', 'slide-in-top');
                }, 50);

            }, 1000);
        }, 1000);
    }
    
    function handleActionLog() { 
        logEditable = false; tempLogRoundsData = JSON.parse(JSON.stringify(logRoundsData)); 
        buildLogTable(); 
        document.getElementById('btn-log-edit').style.display = isWinnerState ? 'none' : 'block';
        document.getElementById('log-edit-controls').style.display = 'none';
        openModal('log-modal'); 
    }
    
    function enableLogEdit() {
        AudioSys.playSFX('button.mp3'); logEditable = true;
        document.getElementById('btn-log-edit').style.display = 'none';
        document.getElementById('log-edit-controls').style.display = 'flex';
        buildLogTable();
    }
    
    function cancelLogEdit() {
        AudioSys.playSFX('button.mp3'); logEditable = false; tempLogRoundsData = JSON.parse(JSON.stringify(logRoundsData)); 
        document.getElementById('btn-log-edit').style.display = 'block';
        document.getElementById('log-edit-controls').style.display = 'none';
        buildLogTable();
    }
    
    function saveLogEdit() {
        AudioSys.playSFX('button.mp3'); logEditable = false; logRoundsData = JSON.parse(JSON.stringify(tempLogRoundsData)); 
        saveLog();
        document.getElementById('btn-log-edit').style.display = 'block';
        document.getElementById('log-edit-controls').style.display = 'none';
        buildLogTable();
    }

    function toggleLogBadge(rIdx, pIdx) {
        if(!logEditable) return; AudioSys.playSFX('button.mp3');
        const rd = tempLogRoundsData[rIdx]; rd.players.forEach((p, i) => { if(i !== pIdx) p.hasBadge = false; });
        rd.players[pIdx].hasBadge = !rd.players[pIdx].hasBadge; buildLogTable();
    }

    function saveLog() { logScreenHistory = logScreenHistory.slice(0, logScreenHistoryIndex+1); logScreenHistory.push(JSON.stringify(logRoundsData)); logScreenHistoryIndex++; }
    function logUndo() { if(!logEditable) return; AudioSys.playSFX('button.mp3'); if(logScreenHistoryIndex>0) { logScreenHistoryIndex--; tempLogRoundsData = JSON.parse(logScreenHistory[logScreenHistoryIndex]); buildLogTable(); } }
    function logRedo() { if(!logEditable) return; AudioSys.playSFX('button.mp3'); if(logScreenHistoryIndex<logScreenHistory.length-1) { logScreenHistoryIndex++; tempLogRoundsData = JSON.parse(logScreenHistory[logScreenHistoryIndex]); buildLogTable(); } }

    function buildLogTable() {
        const wrapper = document.getElementById('log-table-container');
        wrapper.innerHTML = '';
        
        let targetData = logEditable ? tempLogRoundsData : logRoundsData;
        if(targetData.length === 0) { 
            wrapper.innerHTML = `<div style="color:white; font-size:32px; text-align:center; padding:60px; font-weight:bold;">${t('empty_log')}</div>`; 
            return; 
        }
        
        for (let m = 1; m <= currentMatch; m++) {
            let matchRounds = targetData.filter(rd => rd.matchNum === m);
            if (matchRounds.length === 0 && m !== currentMatch) continue;
            
            let isCurrentMatch = (m === currentMatch);
            
            let matchTitle = document.createElement('div');
            matchTitle.style.color = '#f1c40f';
            matchTitle.style.fontSize = '35px';
            matchTitle.style.fontWeight = 'bold';
            matchTitle.style.textAlign = 'center';
            matchTitle.style.margin = '20px 0 10px 0';
            matchTitle.style.textShadow = '2px 2px 0px #000';
            matchTitle.innerText = `${t('match_lbl').toUpperCase()} ${m}`;
            wrapper.appendChild(matchTitle);

            let table = document.createElement('table');
            table.className = 'log-table';
            
            let thead = document.createElement('thead');
            let htr = document.createElement('tr');
            htr.innerHTML = `<th>${t('round')}</th>`;
            
            let numCols = isCurrentMatch ? activePlayerCount : (matchRounds.length > 0 ? matchRounds[0].players.length : activePlayerCount);
            
            for(let p = 0; p < numCols; p++) { 
                let pName = customPlayerNames[p] || `P${p+1}`;
                if (!isCurrentMatch && matchRounds.length > 0 && matchRounds[0].players[p]) { pName = matchRounds[0].players[p].playerName; }
                htr.innerHTML += `<th>${pName}</th>`; 
            }
            
            if (isCurrentMatch) {
                htr.innerHTML += `<th class="${logEditable ? '' : 'col-hide'}">
                    <div style="display:flex; justify-content:center; gap:10px;">
                        <div class="ur-btn ${logScreenHistoryIndex>0 ? '' : 'disabled'}" style="transform:scale(0.8);" onclick="logUndo()">&#8634;</div>
                        <div class="ur-btn ${logScreenHistoryIndex<logScreenHistory.length-1 ? '' : 'disabled'}" style="transform:scale(0.8);" onclick="logRedo()">&#8635;</div>
                    </div>
                </th>`; 
            }
            thead.appendChild(htr);
            table.appendChild(thead);
            
            let tbody = document.createElement('tbody');
            if (matchRounds.length === 0) {
                let emptyColspan = 1 + numCols + (isCurrentMatch ? 1 : 0);
                tbody.innerHTML = `<tr><td colspan="${emptyColspan}" style="padding:25px; color:#95a5a6; font-style:italic;">-</td></tr>`;
            } else {
                matchRounds.forEach((rd) => {
                    let rIdx = targetData.findIndex(x => x === rd);
                    let tr = document.createElement('tr');
                    tr.innerHTML = `<td style="color:#f1c40f;font-weight:bold">${t('round')} ${rd.roundNum}</td>`;
                    
                    for(let pIdx=0; pIdx < numCols; pIdx++) {
                        let pd = rd.players[pIdx];
                        if(pd) {
                            let td = document.createElement('td'); 
                            if(logEditable && isCurrentMatch) td.className = 'editable-cell';
                            
                            let badgeHTML = pd.hasBadge ? `<img src="${BASE_URL}badge.png" style="height:40px; cursor:${(logEditable && isCurrentMatch)?'pointer':'default'};" onclick="event.stopPropagation(); if(${isCurrentMatch}) toggleLogBadge(${rIdx}, ${pIdx})">` : 
                                                          `<div style="width:40px; height:40px; cursor:${(logEditable && isCurrentMatch)?'pointer':'default'};" onclick="event.stopPropagation(); if(${isCurrentMatch}) toggleLogBadge(${rIdx}, ${pIdx})"></div>`;
                            
                            td.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;gap:10px;">${badgeHTML} <span>${pd.score}</span></div>`;
                            if(logEditable && isCurrentMatch) td.onclick = () => openKeypad('score', rIdx, pIdx);
                            tr.appendChild(td);
                        } else {
                            tr.innerHTML += `<td>-</td>`;
                        }
                    }
                    
                    if (isCurrentMatch) {
                        let dtd = document.createElement('td'); dtd.className = logEditable ? '' : 'col-hide';
                        let db = document.createElement('button'); db.className='trash-btn'; db.innerHTML='&#128465;';
                        db.onclick = () => { AudioSys.playSFX('button.mp3'); tempLogRoundsData.splice(rIdx, 1); buildLogTable(); };
                        dtd.appendChild(db); tr.appendChild(dtd);
                    }
                    tbody.appendChild(tr);
                });
            }
            table.appendChild(tbody);
            wrapper.appendChild(table);
        }
    }

</script>

<!-- SUNTIKAN PWA SERVICE WORKER -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then((registration) => {
                    console.log('PWA ServiceWorker berhasil didaftarkan dengan scope:', registration.scope);
                    
                    // Cek otomatis jika ada update pada file sw.js itu sendiri
                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('Update aset baru tersedia, melakukan refresh otomatis...');
                                window.location.reload();
                            }
                        };
                    };
                })
                .catch((err) => {
                    console.log('PWA ServiceWorker gagal didaftarkan:', err);
                });
        });
    }
</script>
